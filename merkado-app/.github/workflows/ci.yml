name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: merkado-app/package-lock.json
      - run: npm ci
        working-directory: merkado-app
      - run: npm run lint
        working-directory: merkado-app
      - run: npm run typecheck
        working-directory: merkado-app
      - run: npm test
        working-directory: merkado-app
      - run: npm run build
        working-directory: merkado-app
